<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>教务处管理后台 · 课堂课时确认与学时统计</title>
  <link rel="stylesheet" href="css/admin.css?v=1">
</head>
<body>

<!-- ============================================================ 登录页 -->
<div id="login-view" class="login-wrap" hidden>
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="login-brand">
      <div class="logo">课</div>
      <h1>教务处管理后台</h1>
      <p>课堂课时确认与学时统计 · Web 管理端</p>
    </div>
    <div class="field">
      <label for="login-no">工号 / 学号</label>
      <input type="text" id="login-no" name="no" placeholder="请输入工号，例如 ADMIN001" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="login-password">密码</label>
      <input type="password" id="login-password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
    </div>
    <div class="login-row">
      <label><input type="checkbox" id="login-remember" checked> 记住登录</label>
      <a href="#" id="login-forgot">忘记密码？</a>
    </div>
    <div class="inline-error" id="login-error" role="alert"></div>
    <button type="submit" class="btn btn-block" id="login-submit">登 录</button>
    <div class="login-tip">
      仅<b>院系管理员</b>与<b>教务处</b>可登录本后台；教师与班干部请使用微信小程序。<br>
      演示账号：<code>ADMIN001</code> / <code>123456</code>（教务处）、<code>2017001</code> / <code>123456</code>（院系管理员）。<br>
      密码连续错误 5 次将锁定 15 分钟。
    </div>
  </form>
</div>

<!-- ============================================================ 主应用 -->
<div id="app-view" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">课时确认后台<small>教务处 / 院系管理员</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="topbar-right">
        <span class="role-tag" id="role-tag">—</span>
        <span id="user-name">—</span>
        <div class="avatar" id="user-avatar">?</div>
        <button class="btn-link" id="btn-test-report" type="button">测试报告</button>
        <button class="btn-link" id="btn-change-pwd" type="button">修改密码</button>
        <button class="btn-link danger" id="btn-logout" type="button">退出</button>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div id="toast-root"></div>
<div id="modal-root"></div>
<div id="drawer-root"></div>

<!-- 工具与基础模块（app.js 需先于页面模块加载：页面通过 Admin.registerPage 注册） -->
<script src="js/api.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/app.js?v=3"></script>
<!-- 页面模块（纯原生，无构建） -->
<script src="js/pages/login.js?v=1"></script>
<script src="js/pages/dashboard.js?v=2"></script>
<script src="js/pages/records.js?v=2"></script>
<script src="js/pages/courses.js?v=1"></script>
<script src="js/pages/makeup.js?v=1"></script>
<script src="js/pages/appeal.js?v=1"></script>
<script src="js/pages/import.js?v=1"></script>
<script src="js/pages/export.js?v=2"></script>
<script src="js/pages/config.js?v=1"></script>
<script src="js/pages/logs.js?v=1"></script>
</body>
</html>
